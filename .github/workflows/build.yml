name: Build iOS Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create main.m File
        run: |
          cat << 'EOF' > main.m
          #import <UIKit/UIKit.h>

          __attribute__((constructor)) static void initializeMyUI() {
              dispatch_async(dispatch_get_main_queue(), ^{
                  UIViewController *rootVC = [UIApplication sharedApplication].keyWindow.rootViewController;
                  if (rootVC) {
                      // สร้าง UI แบบมีช่องกรอก License Key และเมนู
                      UIAlertController *alert = [UIAlertController alertControllerWithTitle:@"🔐 Custom Key System"
                                                                                     message:@"กรุณากรอก Key เพื่อเข้าใช้งานเมนู"
                                                                              preferredStyle:UIAlertControllerStyleAlert];
                      
                      // เพิ่มช่องกรอกข้อความ
                      [alert addTextFieldWithConfigurationHandler:^(UITextField *textField) {
                          textField.placeholder = @"ใส่ Key ที่นี่...";
                      }];
                      
                      // ปุ่มยืนยัน
                      UIAlertAction *submitAction = [UIAlertAction actionWithTitle:@"ยืนยัน Key" 
                                                                             style:UIAlertActionStyleDefault 
                                                                           handler:^(UIAlertAction *action) {
                          NSString *key = alert.textFields.firstObject.text;
                          
                          // แสดง Alert แจ้งผลการใส่ Key
                          UIAlertController *resultAlert = [UIAlertController alertControllerWithTitle:@"ผลการตรวจสอบ"
                                                                                                message:[NSString stringWithFormat:@"Key ที่ใส่คือ: %@", key]
                                                                                         preferredStyle:UIAlertControllerStyleAlert];
                          [resultAlert addAction:[UIAlertAction actionWithTitle:@"ตกลง" style:UIAlertActionStyleDefault handler:nil]];
                          [rootVC presentViewController:resultAlert animated:YES completion:nil];
                      }];
                      
                      [alert addAction:submitAction];
                      [alert addAction:[UIAlertAction actionWithTitle:@"ยกเลิก" style:UIAlertActionStyleCancel handler:nil]];
                      
                      [rootVC presentViewController:alert animated:YES completion:nil];
                  }
              });
          }
          EOF

      - name: Compile Dylib for iOS (arm64)
        run: |
          xcrun -sdk iphoneos clang -dynamiclib -arch arm64 main.m -o MyUI.dylib -framework UIKit -framework Foundation

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyUI-Dylib
          path: MyUI.dylib
