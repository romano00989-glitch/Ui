name: Build iOS Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create main.m File
        run: |
          cat << 'EOF' > main.m
          #import <UIKit/UIKit.h>

          @interface ModMenuView : UIView
          @end

          @implementation ModMenuView

          - (instancetype)initWithFrame:(CGRect)frame {
              self = [super initWithFrame:frame];
              if (self) {
                  self.backgroundColor = [[UIColor blackColor] colorWithAlphaComponent:0.85];
                  self.layer.cornerRadius = 15;
                  self.layer.borderWidth = 1.5;
                  self.layer.borderColor = [UIColor cyanColor].CGColor;
                  self.clipsToBounds = YES;
                  
                  // Title Label
                  UILabel *titleLabel = [[UILabel alloc] initWithFrame:CGRectMake(0, 10, frame.size.width, 30)];
                  titleLabel.text = @"🔥 MOD MENU UI 🔥";
                  titleLabel.textColor = [UIColor cyanColor];
                  titleLabel.textAlignment = NSTextAlignmentCenter;
                  titleLabel.font = [UIFont boldSystemFontOfSize:16];
                  [self addSubview:titleLabel];
                  
                  // Switch 1
                  UISwitch *switch1 = [[UISwitch alloc] initWithFrame:CGRectMake(frame.size.width - 60, 50, 0, 0)];
                  [self addSubview:switch1];
                  
                  UILabel *label1 = [[UILabel alloc] initWithFrame:CGRectMake(15, 50, 150, 30)];
                  label1.text = @"Feature 1";
                  label1.textColor = [UIColor whiteColor];
                  [self addSubview:label1];
                  
                  // Close Button
                  UIButton *closeBtn = [UIButton buttonWithType:UIButtonTypeSystem];
                  closeBtn.frame = CGRectMake(15, frame.size.height - 40, frame.size.width - 30, 30);
                  [closeBtn setTitle:@"ซ่อนเมนู" forState:UIControlStateNormal];
                  [closeBtn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
                  closeBtn.backgroundColor = [UIColor redColor];
                  closeBtn.layer.cornerRadius = 8;
                  [closeBtn addTarget:self action:@selector(hideMenu) forControlEvents:UIControlEventTouchUpInside];
                  [self addSubview:closeBtn];
              }
              return self;
          }

          - (void)hideMenu {
              self.hidden = YES;
          }

          @end

          __attribute__((constructor)) static void initializeMyUI() {
              dispatch_async(dispatch_get_main_queue(), ^{
                  UIWindow *keyWindow = [UIApplication sharedApplication].keyWindow;
                  if (keyWindow) {
                      // สร้าง Mod Menu กลางหน้าจอ
                      ModMenuView *menu = [[ModMenuView alloc] initWithFrame:CGRectMake(50, 150, 250, 200)];
                      [keyWindow addSubview:menu];
                  }
              });
          }
          EOF

      - name: Compile Dylib for iOS (arm64)
        run: |
          xcrun -sdk iphoneos clang -dynamiclib -arch arm64 main.m -o MyUI.dylib -framework UIKit -framework Foundation

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyUI-Dylib
          path: MyUI.dylib
