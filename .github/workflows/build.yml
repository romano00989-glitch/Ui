name: Build iOS Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create main.m File
        run: |
          cat << 'EOF' > main.m
          #import <UIKit/UIKit.h>

          __attribute__((constructor)) static void initializeMyUI() {
              dispatch_async(dispatch_get_main_queue(), ^{
                  UIViewController *rootVC = [UIApplication sharedApplication].keyWindow.rootViewController;
                  if (rootVC) {
                      UIAlertController *alert = [UIAlertController alertControllerWithTitle:@"My Mobile UI"
                                                                                     message:@"บิลด์สำเร็จแล้ว!"
                                                                              preferredStyle:UIAlertControllerStyleAlert];
                      [alert addAction:[UIAlertAction actionWithTitle:@"ตกลง" style:UIAlertActionStyleDefault handler:nil]];
                      [rootVC presentViewController:alert animated:YES completion:nil];
                  }
              });
          }
          EOF

      - name: Compile Dylib for iOS (arm64)
        run: |
          xcrun -sdk iphoneos clang -dynamiclib -arch arm64 main.m -o MyUI.dylib -framework UIKit -framework Foundation

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyUI-Dylib
          path: MyUI.dylib
