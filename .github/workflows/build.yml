name: Build iOS Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile Dylib for iOS (arm64)
        run: |
          xcrun -sdk iphoneos clang -dynamiclib -arch arm64 main.m -o MyUI.dylib -framework UIKit -framework Foundation

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyUI-Dylib
          path: MyUI.dylib
